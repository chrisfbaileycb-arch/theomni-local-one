services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # override anything from .env that must point at the compose network
      MONGO_URL: mongodb://mongo:27017
      DB_NAME: ${DB_NAME:-omnilocal}
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
